services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: snoRNA-BIU
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5433/snoRNA-BIU
      DATA_PATH: /app/data
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    volumes:
      - ../:/app/data
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    env_file: .env
    environment:
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
